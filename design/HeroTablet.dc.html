<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" />
  <style>
    body {
      margin: 0;
      background: #FDF9F4;
      color: #1C1917;
      font-family: 'IBM Plex Sans Thai Looped', 'Noto Sans Thai', system-ui, sans-serif;
      font-size: 19px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, .dp {
      font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans Thai Looped', system-ui, sans-serif;
      font-weight: 600;
      line-height: 1.25;
      margin: 0;
      letter-spacing: -0.2px;
    }
    p { margin: 0; }
    a { color: #B8420C; text-decoration: none; }
    a:hover { color: #8F3208; text-decoration: underline; }
    ::selection { background: #FF6C1D; color: #FFFFFF; }
  </style>
</helmet>

<div style="background: #FDF9F4">

  <div style="padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 2px solid #1C1917">
    <div style="display: flex; align-items: center; gap: 11px">
      <div style="width: 40px; height: 40px; background: #FF6C1D; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z" /></svg>
      </div>
      <span class="dp" style="font-size: 20px; font-weight: 700">ศูนย์ยืม-คืนกายอุปกรณ์</span>
    </div>
    <div style="width: 46px; height: 46px; border: 2px solid #1C1917; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex-shrink: 0">
      <span style="width: 21px; height: 2.5px; background: #1C1917; display: block"></span>
      <span style="width: 21px; height: 2.5px; background: #1C1917; display: block"></span>
      <span style="width: 21px; height: 2.5px; background: #1C1917; display: block"></span>
    </div>
  </div>

  <!-- No overlay at this width at all: the text sits on solid cream above the
       photograph. Nothing about the crop can put it at risk. -->
  <div style="padding: 30px 28px 28px">
    <div style="display: inline-flex; align-items: center; gap: 9px; background: #1C1917; color: #FFFFFF; font-size: 17px; font-weight: 600; padding: 9px 17px; margin-bottom: 20px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FF8A47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
      ยืมฟรี ไม่มีค่าใช้จ่าย
    </div>

    <h1 style="font-size: 46px; font-weight: 700; letter-spacing: -1.1px; margin-bottom: 18px; text-wrap: balance">ยืมกายอุปกรณ์การแพทย์<br /><span style="background: #FF6C1D; color: #FFFFFF; padding: 0 12px; display: inline-block; margin-top: 6px">ที่บ้านคุณ</span> ได้ง่าย ๆ</h1>

    <p style="font-size: 20px; color: #4A403A; line-height: 1.7; margin-bottom: 26px; max-width: 52ch">วีลแชร์ ไม้ค้ำยัน เตียงผู้ป่วย เครื่องผลิตออกซิเจน สำหรับผู้ป่วยและผู้ดูแล ส่งคำขอออนไลน์ได้ทันที ไม่ต้องสมัครสมาชิก</p>

    <div style="display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 24px">
      <div style="flex-grow: 1; min-width: 260px; background: #FF6C1D; color: #FFFFFF; font-size: 21px; font-weight: 700; height: 64px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Sans Thai', sans-serif">ส่งคำขอยืมอุปกรณ์</div>
      <div style="flex-grow: 1; min-width: 200px; border: 2.5px solid #1C1917; color: #1C1917; font-size: 21px; font-weight: 700; height: 64px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Sans Thai', sans-serif">ดูวิธีใช้งาน</div>
    </div>

    <div style="display: flex; gap: 22px; flex-wrap: wrap; font-size: 17px; color: #4A403A; font-weight: 500">
      <span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#166B36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>ไม่มีค่าใช้จ่าย</span>
      <span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#166B36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>เหมาะกับทุกวัย</span>
      <span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#166B36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>ข้อมูลเข้ารหัสปลอดภัย</span>
    </div>
  </div>

  <div style="height: 430px; background-image: url(./hero-wide.jpg); background-size: cover; background-position: 64% center"></div>

</div>
</x-dc>
</body>
</html>
