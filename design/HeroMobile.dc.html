<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" />
  <style>
    body {
      margin: 0;
      background: #FDF9F4;
      color: #1C1917;
      font-family: 'IBM Plex Sans Thai Looped', 'Noto Sans Thai', system-ui, sans-serif;
      font-size: 19px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, .dp {
      font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans Thai Looped', system-ui, sans-serif;
      font-weight: 600;
      line-height: 1.25;
      margin: 0;
      letter-spacing: -0.2px;
    }
    p { margin: 0; }
    a { color: #B8420C; text-decoration: none; }
    a:hover { color: #8F3208; text-decoration: underline; }
    ::selection { background: #FF6C1D; color: #FFFFFF; }
  </style>
</helmet>

<div style="position: relative; width: 100%; height: 900px; overflow: hidden; background: #FDF9F4">

  <div style="position: absolute; inset: 0; background-image: url(./hero-tall.jpg); background-size: cover; background-position: center bottom"></div>

  <!-- Barely any wash needed: the upper wall in this crop is already an even
       cream. It is here so a darker shadow band cannot break the text. -->
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(253,249,244,0.94) 0%, rgba(253,249,244,0.86) 40%, rgba(253,249,244,0) 60%)"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; font-size: 18px">

    <div style="padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; align-items: center; gap: 10px; min-width: 0">
        <div style="width: 38px; height: 38px; background: #FF6C1D; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z" /></svg>
        </div>
        <span class="dp" style="font-size: 18px; font-weight: 700">ศูนย์ยืม-คืนกายอุปกรณ์</span>
      </div>
      <div style="width: 46px; height: 46px; border: 2px solid #1C1917; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex-shrink: 0; background: rgba(253,249,244,0.7)">
        <span style="width: 21px; height: 2.5px; background: #1C1917; display: block"></span>
        <span style="width: 21px; height: 2.5px; background: #1C1917; display: block"></span>
        <span style="width: 21px; height: 2.5px; background: #1C1917; display: block"></span>
      </div>
    </div>

    <div style="padding: 14px 20px 0">
      <div style="display: inline-flex; align-items: center; gap: 8px; background: #1C1917; color: #FFFFFF; font-size: 16px; font-weight: 600; padding: 8px 15px; margin-bottom: 18px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF8A47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
        ยืมฟรี ไม่มีค่าใช้จ่าย
      </div>

      <h1 style="font-size: 36px; font-weight: 700; letter-spacing: -0.8px; margin-bottom: 14px; text-wrap: balance">ยืมกายอุปกรณ์<br />การแพทย์<br /><span style="background: #FF6C1D; color: #FFFFFF; padding: 0 10px; display: inline-block; margin-top: 6px">ที่บ้านคุณ</span></h1>

      <p style="font-size: 19px; color: #4A403A; line-height: 1.7; margin-bottom: 22px">วีลแชร์ ไม้ค้ำยัน เตียงผู้ป่วย เครื่องผลิตออกซิเจน ส่งคำขอออนไลน์ได้ทันที</p>

      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="background: #FF6C1D; color: #FFFFFF; font-size: 21px; font-weight: 700; height: 64px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Sans Thai', sans-serif">ส่งคำขอยืมอุปกรณ์</div>
        <div style="background: rgba(253,249,244,0.9); border: 2.5px solid #1C1917; color: #1C1917; font-size: 21px; font-weight: 700; height: 64px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Sans Thai', sans-serif">ดูวิธีใช้งาน</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
